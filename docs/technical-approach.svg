<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" width="1500" height="920" role="img" aria-label="RationSaathi technical approach">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a3a"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e5c"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c6e26"/></marker></defs>
<rect width="1500" height="920" fill="#f3f0e6"/>
<text x="40" y="40" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#1e2a3a" text-anchor="start">RationSaathi — technical approach</text>
<text x="40" y="62" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="start">Offline-first PWA + small API. The maths, the report wording and the privacy checks are plain code; AI only drafts, and only when the user allows it.</text>
<rect x="30" y="100" width="470" height="765" rx="14" fill="#eef3f0" stroke="#0f6e5c" stroke-width="1.8"/>
<text x="50" y="129" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0f6e5c" text-anchor="start">ON THE PHONE (installable, works offline)</text>
<rect x="540" y="100" width="470" height="765" rx="14" fill="#f4f1ea" stroke="#44546a" stroke-width="1.8"/>
<text x="560" y="129" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#44546a" text-anchor="start">SERVER (Express + TypeScript + SQLite)</text>
<rect x="1050" y="100" width="420" height="765" rx="14" fill="#f7f1e3" stroke="#9c6e26" stroke-width="1.8"/>
<text x="1070" y="129" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#9c6e26" text-anchor="start">OUTSIDE (only when the user chooses)</text>
<rect x="50" y="146" width="430" height="86" rx="8" fill="#fbf9f2" stroke="#0f6e5c" stroke-width="1.3"/>
<text x="62" y="168" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Next.js app (React, Tailwind)</text>
<text x="62" y="190" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Household and rule setup · month ledger · report</text>
<text x="62" y="208" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Complaint helper · 13 languages · &quot;Listen&quot; everywhere</text>
<rect x="50" y="246" width="430" height="158" rx="8" fill="#dcece7" stroke="#0f6e5c" stroke-width="1.3"/>
<text x="62" y="268" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Shared engine (same code in browser and server)</text>
<text x="62" y="290" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Entitlement and shortfall maths in whole grams (no AI)</text>
<text x="62" y="308" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Neutral report and complaint text, English and Hindi</text>
<text x="62" y="326" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Neutrality guard: blocks words that accuse anyone</text>
<text x="62" y="344" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Aadhaar / VID redaction (checksum-validated)</text>
<text x="62" y="362" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Offline readers for receipts, SMS and spoken sentences</text>
<text x="62" y="380" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Card catalog: 36 states and UTs, each with its source</text>
<rect x="50" y="418" width="430" height="104" rx="8" fill="#fbf9f2" stroke="#0f6e5c" stroke-width="1.3"/>
<text x="62" y="440" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">IndexedDB: source of truth on the device</text>
<text x="62" y="462" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Households, months, records, reports, filings</text>
<text x="62" y="480" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Photos waiting to be read · sync outbox</text>
<text x="62" y="498" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9c6e26" text-anchor="start">Ration card number stays here. It is never sent.</text>
<rect x="50" y="536" width="209" height="68" rx="8" fill="#fbf9f2" stroke="#0f6e5c" stroke-width="1.3"/>
<text x="62" y="558" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Service worker</text>
<text x="62" y="580" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">App opens with no signal</text>
<rect x="271" y="536" width="209" height="68" rx="8" fill="#fbf9f2" stroke="#0f6e5c" stroke-width="1.3"/>
<text x="283" y="558" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Browser speech</text>
<text x="283" y="580" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Voice entry · read-aloud</text>
<rect x="50" y="618" width="430" height="104" rx="8" fill="#f1e4c7" stroke="#9c6e26" stroke-width="1.3"/>
<text x="62" y="640" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#9c6e26" text-anchor="start">Rules the screens enforce</text>
<text x="62" y="662" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Rule must be confirmed before any total shows</text>
<text x="62" y="680" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Anything AI reads is a draft the user confirms</text>
<text x="62" y="698" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Complaint is copied only after a read-back</text>
<text x="50" y="790" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">Offline changes are queued and sent when the connection returns;</text>
<text x="50" y="807" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">newer server copies are pulled back.</text>
<rect x="560" y="146" width="430" height="68" rx="8" fill="#fbf9f2" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="168" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Device token (no accounts)</text>
<text x="572" y="190" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Random token on first launch; only its hash is stored</text>
<rect x="560" y="228" width="430" height="86" rx="8" fill="#fbf9f2" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="250" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">REST API  /api/v1</text>
<text x="572" y="272" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">households · checks · records · summary · sync</text>
<text x="572" y="290" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">reports + export · complaint helper · filing reference</text>
<rect x="560" y="328" width="430" height="122" rx="8" fill="#e4e8ee" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="350" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Photo pipeline (all on this server)</text>
<text x="572" y="372" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">1  Quality gate: blur, dark, glare, too small → retake</text>
<text x="572" y="390" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">2  Local OCR (Tesseract, English + Hindi)</text>
<text x="572" y="408" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">3  Find Aadhaar numbers and paint them black</text>
<text x="572" y="426" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">4  Keep only the masked JPEG; original never saved</text>
<rect x="560" y="464" width="430" height="104" rx="8" fill="#fbf9f2" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="486" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">AI drafts</text>
<text x="572" y="508" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Rule-based reading first; hosted model only if allowed</text>
<text x="572" y="526" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Results stay drafts until the user confirms them</text>
<text x="572" y="544" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Numbers re-added in code; translations keep every number</text>
<rect x="560" y="582" width="430" height="86" rx="8" fill="#fbf9f2" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="604" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Reports</text>
<text x="572" y="626" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Immutable snapshot + SHA-256 hash; new version on change</text>
<text x="572" y="644" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Export: text, printable page, PDF (English + Hindi)</text>
<rect x="560" y="682" width="430" height="68" rx="8" fill="#fbf9f2" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="704" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Channel directory</text>
<text x="572" y="726" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">35 state card portals + helplines, with source and date</text>
<rect x="560" y="764" width="430" height="68" rx="8" fill="#e4e8ee" stroke="#44546a" stroke-width="1.3"/>
<text x="572" y="786" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">SQLite file + masked photos on disk</text>
<text x="572" y="808" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">&quot;Delete everything&quot; removes the device and all its files</text>
<rect x="1070" y="146" width="380" height="122" rx="8" fill="#fbf9f2" stroke="#9c6e26" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="1082" y="168" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Official grievance portal</text>
<text x="1082" y="190" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">nfsa.gov.in or the state portal, in a new tab</text>
<text x="1082" y="208" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">The user enters their own Aadhaar OTP and submits</text>
<text x="1082" y="226" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9c6e26" text-anchor="start">RationSaathi never submits, embeds or copies</text>
<text x="1082" y="244" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9c6e26" text-anchor="start">any government login or form.</text>
<rect x="1070" y="282" width="380" height="122" rx="8" fill="#fbf9f2" stroke="#9c6e26" stroke-width="1.3"/>
<text x="1082" y="304" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Research data → card catalog</text>
<text x="1082" y="326" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">ration_data/*.csv (state card types and sources)</text>
<text x="1082" y="344" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">pnpm build:card-catalog</text>
<text x="1082" y="362" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Compiled into packages/shared, so it works offline</text>
<text x="1082" y="380" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Only AAY/PHH with an official source pre-fill</text>
<rect x="1070" y="418" width="380" height="140" rx="8" fill="#fbf9f2" stroke="#9c6e26" stroke-width="1.3"/>
<text x="1082" y="440" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#1e2a3a" text-anchor="start">Hosted AI model (optional)</text>
<text x="1082" y="462" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Photo reading, translation, voice and chat help</text>
<text x="1082" y="480" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">Used only after &quot;Send once&quot; / &quot;Always allow&quot;</text>
<text x="1082" y="498" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">and only if the server has a key</text>
<text x="1082" y="516" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9c6e26" text-anchor="start">Sent: masked photo or redacted text.</text>
<text x="1082" y="534" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9c6e26" text-anchor="start">Never: card number, Aadhaar, or an account.</text>
<rect x="1070" y="572" width="380" height="140" rx="8" fill="#f1e4c7" stroke="#9c6e26" stroke-width="1.3"/>
<text x="1082" y="594" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#9c6e26" text-anchor="start">What this is not</text>
<text x="1082" y="616" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">No farm-to-shop tracing</text>
<text x="1082" y="634" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">No ranking or naming of shops or officials</text>
<text x="1082" y="652" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">No cause stated: reports list possible causes</text>
<text x="1082" y="670" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">and say none is established</text>
<text x="1082" y="688" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">No automatic filing</text>
<path d="M500,325.0 L540,325.0" fill="none" stroke="#0f6e5c" stroke-width="2" marker-end="url(#at)" marker-start="url(#at)" stroke-linejoin="round"/>
<rect x="499.3" y="305.5" width="41.400000000000006" height="17.5" rx="4" fill="#f3f0e6" opacity="0.95"/>
<text x="520" y="317.0" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0f6e5c" text-anchor="middle">HTTPS</text>
<path d="M990,516.0 L1030,516.0 L1030,488.0 L1070,488.0" fill="none" stroke="#9c6e26" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aw)" stroke-linejoin="round"/>
<rect x="974.02" y="494.5" width="111.96000000000001" height="17.5" rx="4" fill="#f3f0e6" opacity="0.95"/>
<text x="1030" y="506.0" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#9c6e26" text-anchor="middle">only with consent</text>
<path d="M265,100 L265,84 L1420,84 L1420,146" fill="none" stroke="#9c6e26" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aw)" stroke-linejoin="round"/>
<rect x="544.56" y="68" width="430.88000000000005" height="18" rx="4" fill="#f3f0e6" opacity="0.95"/>
<text x="760" y="80" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#9c6e26" text-anchor="middle">the user opens the portal themselves and files it with their own OTP</text>
<text x="40" y="898" font-family="'Public Sans','DejaVu Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">Stack: pnpm monorepo · Next.js 16 / React 19 / Tailwind 4 · Express · node:sqlite · sharp · Tesseract · pdfkit · zod · vitest + Playwright checks</text>
</svg>
